name: Deploy Sculpted App

on:
  push:
    branches:
      - main 

jobs:

  build-ios:
    name: Build & Deploy iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # .env is gitignored, so recreate it from repository variables.
      # These values are bundled into the app (public), so variables, not secrets.
      - name: Create .env
        run: |
          cat > .env <<EOF
          BACKEND_BASE_URL=${{ vars.BACKEND_BASE_URL }}
          AZURE_TENANT_NAME=${{ vars.AZURE_TENANT_NAME }}
          AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}
          AZURE_USER_SIGNIN_FLOW=${{ vars.AZURE_USER_SIGNIN_FLOW }}
          AZURE_USER_SIGNUP_FLOW=${{ vars.AZURE_USER_SIGNUP_FLOW }}
          EOF

      - name: Install Fastlane
        run: gem install fastlane -NV

      - name: Build and upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          cd ios && fastlane upload_to_testflight
